# Release builds: push a v* tag → Windows .exe + Linux .deb/.AppImage are
# built and attached to the GitHub Release automatically.
name: Build installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run smoke
      - name: Build + publish installers
        shell: bash
        run: npx electron-builder --win --publish always > eb-win.log 2>&1; code=$?; tail -n 100 eb-win.log; exit $code
      - name: Post log to debug issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 120 eb-win.log > eb-win-tail.log
          gh issue create --title "[ci-debug] win build log" --body-file eb-win-tail.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: exampilot-win
          path: |
            dist/*.exe
            dist/*.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run smoke
      - name: Build + publish installers
        shell: bash
        run: npx electron-builder --linux --publish always > eb-linux.log 2>&1; code=$?; tail -n 100 eb-linux.log; exit $code
      - name: Post log to debug issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 120 eb-linux.log > eb-linux-tail.log
          gh issue create --title "[ci-debug] linux build log" --body-file eb-linux-tail.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: exampilot-linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.yml
