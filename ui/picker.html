<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Select area</title>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; cursor: crosshair; background: rgba(0,0,0,.25); user-select: none; }
  #hint { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: rgba(10,12,18,.85); color: #fff; font: 13px system-ui; padding: 8px 16px; border-radius: 20px; border: 1px solid #7c3aed; pointer-events: none; }
  #box { position: fixed; border: 2px solid #7c3aed; background: rgba(124,58,237,.12); display: none; box-shadow: 0 0 0 4000px rgba(0,0,0,.35); }
  #dims { position: fixed; background: #7c3aed; color: #fff; font: 11px system-ui; padding: 2px 8px; border-radius: 6px; display: none; pointer-events: none; }
</style>
</head>
<body>
<div id="hint">Drag to select the question area — release to analyze · Esc to cancel</div>
<div id="box"></div>
<div id="dims"></div>
<script>
  const api = window.electronAPI;
  const box = document.getElementById('box');
  const dims = document.getElementById('dims');
  let sx = 0, sy = 0, dragging = false;
  function update(e) {
    const x = Math.min(e.clientX, sx), y = Math.min(e.clientY, sy);
    const w = Math.abs(e.clientX - sx), h = Math.abs(e.clientY - sy);
    box.style.display = 'block';
    box.style.left = x + 'px'; box.style.top = y + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    dims.style.display = 'block';
    dims.style.left = (x + 4) + 'px'; dims.style.top = (y + h + 6) + 'px';
    dims.textContent = `${w} × ${h}`;
  }
  window.addEventListener('mousedown', (e) => { sx = e.clientX; sy = e.clientY; dragging = true; update(e); });
  window.addEventListener('mousemove', (e) => { if (dragging) update(e); });
  window.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    const rect = { x: Math.min(e.clientX, sx), y: Math.min(e.clientY, sy), width: Math.abs(e.clientX - sx), height: Math.abs(e.clientY - sy) };
    if (rect.width < 10 || rect.height < 10) { cancel(); return; }
    if (api && api.pickerDone) api.pickerDone(rect);
  });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') cancel(); });
  function cancel() { if (api && api.pickerDone) api.pickerDone(null); }
</script>
</body>
</html>
